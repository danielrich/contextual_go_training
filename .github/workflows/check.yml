name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install tested Rust toolchain
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt
          rustup default 1.92.0
      - name: Rust tests
        run: cargo +1.92.0 test --locked
      - name: Rust formatting
        run: cargo +1.92.0 fmt --all --check
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - name: Prototype reference tests
        run: python3 -m unittest discover -s tests
      - name: Deployment script syntax
        run: bash -n scripts/build-release.sh scripts/install-service.sh scripts/verify-deploy.sh
      - name: Build Linux release
        run: ./scripts/build-release.sh
