[package]
name = "whole-board"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
default-run = "whole-board"

[lib]
path = "daemon/src/lib.rs"

[[bin]]
name = "whole-board"
path = "daemon/src/main.rs"

[dependencies]
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
flate2 = "1"
rand = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "limit", "set-header"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
strip = true
lto = "thin"

[[test]]
name = "core"
path = "daemon/tests/core.rs"

[[test]]
name = "storage"
path = "daemon/tests/storage.rs"

[[test]]
name = "grading"
path = "daemon/tests/grading.rs"

[[test]]
name = "api"
path = "daemon/tests/api.rs"
